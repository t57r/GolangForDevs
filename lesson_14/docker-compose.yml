services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  fiber-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiber-server
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=documentstore
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mongo_data:
